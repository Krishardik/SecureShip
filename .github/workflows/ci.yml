
  container-security:
    name: Container Vulnerability Scan and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build SecureShip container image
        run: docker build --tag secureship:ci .

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: secureship:ci
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'
          vuln-type: os,library

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureship-cyclonedx-sbom
          path: sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30

      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: secureship:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
